services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fs_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - iot-network

volumes:
  mosquitto_data:

networks:
  iot-network:
    driver: bridge
