services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fs_mosquitto
    ports:
      - "1883:1883"
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - iot-network

  influxdb:
    image: influxdb:2.7
    container_name: fs_influxdb
    ports:
      - "8086:8086"
    environment:
      TZ: Europe/Warsaw
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: floating_sensor
      DOCKER_INFLUXDB_INIT_BUCKET: floating_sensor
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: fs-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - iot-network

  iot-core:
    build: .
    container_name: fs_iot_core
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Warsaw
      MQTT_BROKER_HOST: mosquitto
      INFLUX_HOST: influxdb
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: fs-dev-token
      INFLUX_ORG: floating_sensor
      INFLUX_BUCKET: floating_sensor
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped
    networks:
      - iot-network

  nicegui:
    build: .
    container_name: fs_nicegui
    command: python nicegui/app.py
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Warsaw
      MQTT_BROKER_HOST: mosquitto
      API_BASE: http://iot-core:8000/api/v1
    depends_on:
      - mosquitto
      - iot-core
    restart: unless-stopped
    networks:
      - iot-network

volumes:
  mosquitto_data:
  influxdb_data:

networks:
  iot-network:
    driver: bridge
